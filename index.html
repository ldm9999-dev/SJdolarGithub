<script>
  // URL del Web App de Apps Script (GET) -- devuelve el estado actual de
  // los overrides manuales (manual_overrides) en vivo, sin caché.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi2aKtpl3bVKSS2eQVynH8SPjNbCkGxFBtRzhLzUyDfCz7MPeMwm_hJ_wwcXfZ-UM/exec";
  const PAGE_URL = "https://sanjuandolar.com";

  // Compra y venta se muestran como números enteros, sin decimales ni coma.
  const fmt = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  // Redondea al múltiplo de 10 más cercano (para que compra y venta
  // terminen siempre en 0): si el resto es menos de 5 redondea para abajo,
  // si es 5 o más redondea para arriba (ej. 1494 -> 1490, 1495 -> 1500,
  // 1669 -> 1670). Se aplica a todo lo que se muestra: dólar y euro.
  function roundNearest10(value) {
    return Math.round(value / 10) * 10;
  }
  const dtf = new Intl.DateTimeFormat("es-AR", {
    timeZone: "America/Argentina/Buenos_Aires",
    day: "2-digit", month: "2-digit", year: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });

  function fechaHs(iso) {
    if (!iso) return "sin datos";
    const parts = dtf.formatToParts(new Date(iso)).reduce((a, p) => (a[p.type] = p.value, a), {});
    return `${parts.day}/${parts.month}/${parts.year} - ${parts.hour}:${parts.minute} hs.`;
  }

  function relTime(iso) {
    if (!iso) return "sin datos";
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "hace instantes";
    if (min < 60) return `hace ${min} min`;
    const hr = Math.round(min / 60);
    return hr < 24 ? `hace ${hr} h` : `hace ${Math.round(hr / 24)} d`;
  }

  function cardHTML(cfg) {
    const active = cfg.active;
    if (!active) return "";
    return `
      <div class="card" style="--accent:${cfg.color}">
        <div class="card-title">
          <span class="flag">${cfg.flag}</span>
          <h2>${cfg.label}</h2>
        </div>
        <div class="figures">
          <div class="figure">
            <span class="k">Compra</span>
            <span class="v">${fmt.format(roundNearest10(active.compra))}</span>
          </div>
          <div class="figure">
            <span class="k">Venta</span>
            <span class="v">${fmt.format(roundNearest10(active.venta))}</span>
          </div>
        </div>
      </div>`;
  }

  function render(data) {
    const m = data.manual || {};
    // El euro está atado al dólar (ver refreshLive / Code.gs), así que su
    // insignia manual/auto y su nota siguen al dólar, aunque el número en
    // sí (data.eur_oficial) ya viene calculado -- nunca sale de m.eur_oficial.
    const dollarIsManual = !!m.usd_blue;
    // El dólar oficial se sigue guardando en DATA (por si se vuelve a
    // mostrar más adelante) pero no se muestra en la pizarra.
    const cards = [
      { key: "usd_blue", label: "Dólar", flag: "🇺🇸", color: "#2dd4bf", active: m.usd_blue || data.usd_blue, isManual: dollarIsManual, note: dollarIsManual && m.usd_blue.note },
      { key: "eur_oficial", label: "Euro", flag: "🇪🇺", color: "#a3e635", active: data.eur_oficial, isManual: dollarIsManual, note: dollarIsManual && m.usd_blue.note },
    ];
    document.getElementById("grid").innerHTML = cards.map(cardHTML).join("");

    const activeBlue = m.usd_blue || data.usd_blue;
    const activeEur = data.eur_oficial;

    // La hora de actualización se muestra una sola vez, arriba al lado del
    // título (antes se repetía en cada tarjeta con el mismo horario). Se usa
    // la del dólar porque el euro siempre sale calculado a partir de él.
    const topbarUpdatedEl = document.getElementById("topbarUpdated");
    if (topbarUpdatedEl) {
      topbarUpdatedEl.textContent = activeBlue
        ? `Actualizado ${fechaHs(activeBlue.updated_at)}`
        : "";
    }

    if (activeBlue && activeEur) {
      const shareText =
        `Cotización de hoy 💱\n` +
        `Dólar: compra $${fmt.format(activeBlue.compra)} / venta $${fmt.format(activeBlue.venta)}\n` +
        `Euro: compra $${fmt.format(activeEur.compra)} / venta $${fmt.format(activeEur.venta)}\n\n` +
        `Mirala actualizada acá: ${PAGE_URL}`;
      document.getElementById("shareLink").href =
        "https://wa.me/?text=" + encodeURIComponent(shareText);
    }
  }

  // Los datos que vienen "horneados" en el HTML (generados por Apps Script
  // en la última sincronización, como mucho ~5 minutos de antigüedad) se
  // pintan YA MISMO, apenas carga la página -- así se ve al instante en vez
  // de quedarse en "Actualizando cotización…" esperando los pedidos en vivo
  // (que pueden tardar unos segundos, sobre todo el del Web App de Apps
  // Script). refreshLive() los reemplaza solos, sin parpadeo, en cuanto el
  // dato en vivo (blue de DolarAPI + el override manual vigente desde el
  // Web App) termina de llegar -- si esos pedidos fallan (ej. sin conexión),
  // la página se queda mostrando este dato horneado, así que nunca se ve
  // en blanco.
  let currentData = {"usd_oficial":{"compra":1490,"venta":1540,"updated_at":"2026-10-09T18:55:00.000Z"},"usd_blue":{"compra":1490,"venta":1570,"updated_at":"2026-10-10T15:00:00.000Z"},"eur_oficial":{"compra":1690,"venta":1880,"updated_at":"2026-10-09T01:59:11.401Z"},"manual":{"usd_oficial":null,"usd_blue":{"compra":1480,"venta":1570,"updated_at":"2026-10-09T01:59:11.401Z","note":"Actualizado manualmente vía Telegram","auto_baseline":{"compra":1490,"venta":1570}},"eur_oficial":null},"last_sync":"2026-10-10T17:43:39.459Z"};
  render(currentData);

  async function fetchJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function refreshLive() {
    // Ya no se consulta el endpoint de euro de DolarAPI: el euro se calcula
    // siempre a partir del dólar (ver más abajo).
    const [blue, state] = await Promise.allSettled([
      fetchJSON("https://dolarapi.com/v1/dolares/blue"),
      fetchJSON(APPS_SCRIPT_URL),
    ]);

    // Si las dos llamadas en vivo fallan (ej. sin conexión), no tocamos lo
    // que ya está en pantalla (el dato horneado, pintado arriba apenas
    // cargó la página).
    if (blue.status === "rejected" && state.status === "rejected") {
      return;
    }

    const next = Object.assign({}, currentData);
    if (blue.status === "fulfilled") {
      // Redondeado acá mismo (al múltiplo de 10 más cercano) para que el
      // cálculo del euro de abajo use el mismo valor de dólar que se termina
      // mostrando en pantalla.
      next.usd_blue = {
        compra: roundNearest10(blue.value.compra),
        venta: roundNearest10(blue.value.venta),
        updated_at: blue.value.fechaActualizacion,
      };
    }
    if (state.status === "fulfilled" && state.value && state.value.manual) {
      next.manual = state.value.manual;
    }

    // El euro está atado siempre a la COMPRA del dólar (el valor más bajo
    // entre compra y venta) -- nunca a la venta -- sobre el dólar VIGENTE
    // (manual si hay, si no el automático): compra euro = dólar compra ×
    // 1,14, venta euro = dólar compra × 1,27, redondeado al múltiplo de 10
    // más cercano.
    const activeDollar = (next.manual && next.manual.usd_blue) || next.usd_blue;
    if (activeDollar) {
      next.eur_oficial = {
        compra: roundNearest10(activeDollar.compra * 1.14),
        venta: roundNearest10(activeDollar.compra * 1.27),
        updated_at: activeDollar.updated_at,
      };
    }

    next.last_sync = new Date().toISOString();

    currentData = next;
    render(currentData);
  }

  refreshLive();
  // Si alguien deja la pestaña abierta, la refrescamos sola cada minuto.
  setInterval(refreshLive, 60000);
</script>
