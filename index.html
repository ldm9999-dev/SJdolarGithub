<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cotización del dólar blue y el euro en San Juan, actualizada en vivo.">
<meta name="theme-color" content="#0a0d14">
<title>Dólar San Juan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #0a0d14;
    --bg-line: #1d2430;
    --ink: #f2f4f8;
    --ink-soft: #8791a3;
    --card-bg: #10141d;
    --card-bg-2: #131826;
    --card-line: #232a38;
    --gold: #d4af37;
    --blue: #4fa3e3;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body { width: 100%; }

  body {
    margin: 0;
    background:
      linear-gradient(180deg, rgba(6, 8, 13, 0.9), rgba(6, 8, 13, 0.96)),
      url("fondo-dolares.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  @media (max-width: 480px) {
    body { background-attachment: scroll; }
  }

  .page-pad { padding: 0 20px 40px; }
  @media (max-width: 480px) {
    .page-pad { padding-left: 14px; padding-right: 14px; }
  }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* Barra superior: fondo sólido de punta a punta con línea de acento en la
     base, ícono de marca y nombre del sitio -- estilo cabecera institucional. */
  .topbar {
    background: #05070b;
    border-bottom: 1px solid var(--bg-line);
    box-shadow: 0 1px 0 rgba(212, 175, 55, 0.18);
    padding: 16px 20px;
    margin-bottom: 28px;
  }
  .topbar-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
  }
  .topbar-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    background: linear-gradient(155deg, #e8c968, var(--gold) 60%, #b8902a);
    color: #221a04;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .topbar-title {
    font-weight: 700;
    font-size: clamp(17px, 4.2vw, 22px);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .topbar-title .accent { color: var(--gold); }

  /* Espacios publicitarios: reemplazá el contenido de estos divs por el
     código real del anuncio (por ejemplo Google AdSense, o un banner de un
     comercio) cuando lo tengas. Mientras tanto muestran un placeholder que
     ya respeta el tamaño/forma para no romper el diseño al reemplazarlo. */
  .ad-slot {
    max-width: 760px;
    margin: 0 auto 24px;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px solid var(--card-line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.02);
    color: var(--ink-soft);
    padding: 10px 16px;
    text-align: center;
  }
  .ad-slot .ad-label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .ad-slot.ad-bottom { margin: 28px auto 0; }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 18px;
    margin-bottom: 28px;
  }

  .card {
    position: relative;
    background: linear-gradient(175deg, var(--card-bg-2), var(--card-bg));
    border: 1px solid var(--card-line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 26px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    flex: 1 1 270px;
    min-width: 0;
    max-width: 330px;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }

  .card-badge { position: absolute; top: 18px; right: 18px; }

  .badge {
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 5px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge.auto { background: rgba(255, 255, 255, 0.05); color: var(--ink-soft); border: 1px solid var(--card-line); }
  .badge.manual { background: rgba(212, 175, 55, 0.14); color: var(--gold); border: 1px solid rgba(212, 175, 55, 0.35); }

  .card-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .curr-icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }

  .card-title h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(24px, 6vw, 30px);
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  .figures {
    display: flex;
    justify-content: center;
    gap: 10px;
    text-align: center;
    border-top: 1px solid var(--card-line);
    padding-top: 16px;
  }

  .figure { flex: 1 1 0; min-width: 0; }
  .figure + .figure { border-left: 1px solid var(--card-line); }

  .figure .k {
    display: block;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }

  .figure .v {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(20px, 5vw, 27px);
    letter-spacing: -0.01em;
    color: var(--ink);
    display: block;
    line-height: 1.1;
    white-space: nowrap;
  }

  .figure .v .cur {
    font-size: 0.6em;
    font-weight: 600;
    color: var(--ink-soft);
    margin-right: 1px;
  }

  .updated {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    letter-spacing: 0.01em;
  }

  .share-row { display: flex; justify-content: center; margin-bottom: 24px; }

  .share {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #1e8f56;
    color: #f2f4f8;
    font-weight: 600;
    font-size: 13.5px;
    padding: 11px 22px;
    border-radius: 9px;
    text-decoration: none;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .share svg { width: 16px; height: 16px; fill: #f2f4f8; }

  .foot {
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
    border-top: 1px solid var(--card-line);
    padding-top: 18px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-icon">$</span>
    <span class="topbar-title">Dólar <span class="accent">San Juan</span></span>
  </div>
</div>

<div class="page-pad">

<!-- ESPACIO PUBLICITARIO (arriba). Reemplazá este div por el código real
     del anuncio (imagen, logo del comercio, script de AdSense, etc.)
     cuando lo tengas -- el tamaño/forma ya está pensado para no romper
     el resto del diseño. -->
<div class="ad-slot ad-top" id="adTop">
  <span class="ad-label">Espacio publicitario</span>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="share-row">
    <a class="share" id="shareLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.2 7c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.2L2 22l4.9-1.3C8.5 21.6 10.2 22 12 22c5.5 0 10-4.4 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3C4.4 15 4 13.5 4 12 4 7.5 7.6 4 12 4s8 3.5 8 8-3.6 8.2-8 8.2z"/></svg>
      Compartir por WhatsApp
    </a>
  </div>

  <div class="foot">Cotizaciones informativas, no oficiales. Los valores pueden variar según el punto de cambio.</div>
</div>

<!-- ESPACIO PUBLICITARIO (abajo). Mismo criterio que el de arriba. -->
<div class="ad-slot ad-bottom" id="adBottom">
  <span class="ad-label">Espacio publicitario</span>
</div>

</div><!-- /.page-pad -->

<script>
  // URL del Web App de Apps Script (GET) -- devuelve el estado actual de
  // los overrides manuales (manual_overrides) en vivo, sin caché.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi2aKtpl3bVKSS2eQVynH8SPjNbCkGxFBtRzhLzUyDfCz7MPeMwm_hJ_wwcXfZ-UM/exec";
  const PAGE_URL = "https://sanjuandolar.com";

  const fmt = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const dtf = new Intl.DateTimeFormat("es-AR", {
    timeZone: "America/Argentina/Buenos_Aires",
    day: "2-digit", month: "2-digit", year: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });

  function fechaHs(iso) {
    if (!iso) return "sin datos";
    const parts = dtf.formatToParts(new Date(iso)).reduce((a, p) => (a[p.type] = p.value, a), {});
    return `${parts.day}/${parts.month}/${parts.year} - ${parts.hour}:${parts.minute} hs.`;
  }

  function relTime(iso) {
    if (!iso) return "sin datos";
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "hace instantes";
    if (min < 60) return `hace ${min} min`;
    const hr = Math.round(min / 60);
    return hr < 24 ? `hace ${hr} h` : `hace ${Math.round(hr / 24)} d`;
  }

  function cardHTML(cfg) {
    const active = cfg.manual || cfg.auto;
    if (!active) return "";
    const isManual = !!cfg.manual;
    const badge = isManual
      ? `<span class="badge manual" title="${(cfg.manual.note || "Actualizado manualmente").replace(/"/g, "&quot;")}">manual</span>`
      : `<span class="badge auto">auto</span>`;
    return `
      <div class="card" style="--accent:${cfg.color}">
        <div class="card-badge">${badge}</div>
        <div class="card-title">
          <span class="curr-icon">${cfg.symbol}</span>
          <h2>${cfg.label}</h2>
        </div>
        <div class="figures">
          <div class="figure">
            <span class="k">Compra</span>
            <span class="v"><span class="cur">$</span>${fmt.format(active.compra)}</span>
          </div>
          <div class="figure">
            <span class="k">Venta</span>
            <span class="v"><span class="cur">$</span>${fmt.format(active.venta)}</span>
          </div>
        </div>
        <div class="updated">Actualizado el ${fechaHs(active.updated_at)}</div>
      </div>`;
  }

  function render(data) {
    const m = data.manual || {};
    // El dólar oficial se sigue guardando en DATA (por si se vuelve a
    // mostrar más adelante) pero no se muestra en la pizarra.
    const cards = [
      { key: "usd_blue", label: "Dólar", symbol: "$", color: "#4fa3e3", auto: data.usd_blue, manual: m.usd_blue },
      { key: "eur_oficial", label: "Euro", symbol: "€", color: "#d4af37", auto: data.eur_oficial, manual: m.eur_oficial },
    ];
    document.getElementById("grid").innerHTML = cards.map(cardHTML).join("");

    const activeBlue = m.usd_blue || data.usd_blue;
    const activeEur = m.eur_oficial || data.eur_oficial;
    if (activeBlue && activeEur) {
      const shareText =
        `Cotización de hoy 💱\n` +
        `Dólar blue: $${fmt.format(activeBlue.venta)}\n` +
        `Euro: $${fmt.format(activeEur.venta)}\n\n` +
        `Mirala actualizada acá: ${PAGE_URL}`;
      document.getElementById("shareLink").href =
        "https://wa.me/?text=" + encodeURIComponent(shareText);
    }
  }

  // 1) Primer pintado instantáneo con los datos que vinieron "horneados"
  //    en el HTML (generados por Apps Script en la última sincronización).
  let currentData = {"usd_oficial":{"compra":1485,"venta":1535,"updated_at":"2026-09-23T13:00:00.000Z"},"usd_blue":{"compra":1540,"venta":1560,"updated_at":"2026-09-23T15:59:00.000Z"},"eur_oficial":{"compra":1720.0645,"venta":1734.1356,"updated_at":"2026-09-23T12:56:00.000Z"},"manual":{"usd_oficial":null,"usd_blue":{"compra":1480,"venta":1550,"updated_at":"2026-09-23T16:41:02.037Z","note":"Actualizado manualmente vía Telegram"},"eur_oficial":null},"last_sync":"2026-09-23T16:48:14.367Z"};
  render(currentData);

  // 2) Apenas carga la página, pedimos los valores en vivo directamente
  //    (DolarAPI para blue/euro automáticos, el Web App de Apps Script
  //    para saber si hay algún override manual cargado) y volvemos a
  //    pintar con eso -- así no hay que esperar a que GitHub Pages
  //    actualice el HTML publicado.
  async function fetchJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function refreshLive() {
    const [blue, eur, state] = await Promise.allSettled([
      fetchJSON("https://dolarapi.com/v1/dolares/blue"),
      fetchJSON("https://dolarapi.com/v1/cotizaciones/eur"),
      fetchJSON(APPS_SCRIPT_URL),
    ]);

    const next = Object.assign({}, currentData);
    if (blue.status === "fulfilled") {
      next.usd_blue = {
        compra: blue.value.compra,
        venta: blue.value.venta,
        updated_at: blue.value.fechaActualizacion,
      };
    }
    if (eur.status === "fulfilled") {
      next.eur_oficial = {
        compra: eur.value.compra,
        venta: eur.value.venta,
        updated_at: eur.value.fechaActualizacion,
      };
    }
    if (state.status === "fulfilled" && state.value && state.value.manual) {
      next.manual = state.value.manual;
    }
    next.last_sync = new Date().toISOString();

    currentData = next;
    render(currentData);
  }

  refreshLive();
  // 3) Si alguien deja la pestaña abierta, la refrescamos sola cada minuto.
  setInterval(refreshLive, 60000);
</script>
</body>
</html>
