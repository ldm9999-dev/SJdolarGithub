<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Cotización del dólar blue y el euro en San Juan, actualizada en vivo.">
<meta name="theme-color" content="#0b0d0a">
<title>Dólar San Juan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  :root {
    --bg: #0b0d0a;
    --bg-line: #20261f;
    --ink: #f4f6ef;
    --ink-soft: #93a08d;
    --card-bg: #12160f;
    --card-line: #232b20;
    --gold: #e8b923;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body { width: 100%; }

  body {
    margin: 0;
    background:
      linear-gradient(rgba(8, 10, 7, 0.58), rgba(8, 10, 7, 0.74)),
      url("fondo-dolares.jpg") center / cover no-repeat fixed;
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  }

  @media (max-width: 480px) {
    body { background-attachment: scroll; }
  }

  .page-pad { padding: 0 20px 32px; }
  @media (max-width: 480px) {
    .page-pad { padding-left: 12px; padding-right: 12px; }
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  /* Barra superior estilo "cabecera de sitio": fondo sólido oscuro de punta
     a punta, con un ícono redondo y el nombre del sitio. */
  .topbar {
    background: #05060a;
    border-bottom: 1px solid var(--bg-line);
    padding: 14px 20px;
    margin-bottom: 20px;
  }
  .topbar-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .topbar-icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4bd97a, #1f9a52);
    color: #06210f;
    font-weight: 800;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .topbar-title {
    font-weight: 700;
    font-size: clamp(18px, 4.5vw, 24px);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .topbar-title .accent { color: var(--gold); }

  /* Espacios publicitarios: reemplazá el contenido de estos divs por el
     código real del anuncio (por ejemplo Google AdSense, o un banner de un
     comercio) cuando lo tengas. Mientras tanto muestran un placeholder que
     ya respeta el tamaño/forma para no romper el diseño al reemplazarlo. */
  .ad-slot {
    max-width: 720px;
    margin: 0 auto 20px;
    min-height: 86px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 1px dashed rgba(244, 246, 239, 0.28);
    border-radius: 12px;
    background: rgba(244, 246, 239, 0.06);
    color: var(--ink-soft);
    padding: 10px 16px;
    text-align: center;
  }
  .ad-slot .ad-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .ad-slot.ad-bottom { margin: 24px auto 0; }

  .grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--card-line);
    border-top: 5px solid var(--accent);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1 1 260px;
    min-width: 0;
    max-width: 320px;
    overflow: hidden;
  }

  .card-badge { position: absolute; top: 16px; right: 16px; }

  .badge {
    font-size: 10px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 100px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.auto { background: transparent; color: var(--ink-soft); border: 1px solid var(--card-line); }
  .badge.manual { background: var(--accent); color: #0b0d0a; }

  .card-title {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
  }

  .flag { font-size: 42px; line-height: 1; }

  .card-title h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 42px);
    margin: 0;
    color: var(--accent);
  }

  .figures {
    display: flex;
    justify-content: center;
    gap: 24px;
    text-align: center;
  }

  .figure { flex: 0 1 auto; min-width: 0; }

  .figure .k {
    display: block;
    font-size: 11.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .figure .v {
    font-family: "Fraunces", Georgia, serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(22px, 5.5vw, 32px);
    font-weight: 700;
    color: var(--accent);
    display: block;
    line-height: 1.1;
    white-space: nowrap;
  }

  .updated {
    font-size: 12.5px;
    color: var(--accent);
    opacity: 0.85;
    text-align: center;
  }

  .share-row { display: flex; justify-content: center; margin-bottom: 22px; }

  .share {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #25d366;
    color: #0b1a10;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 100px;
    text-decoration: none;
    box-shadow: var(--shadow);
  }
  .share svg { width: 16px; height: 16px; fill: #0b1a10; }

  .foot {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span class="topbar-icon">$</span>
    <span class="topbar-title">Dólar <span class="accent">San Juan</span></span>
  </div>
</div>

<div class="page-pad">

<!-- ESPACIO PUBLICITARIO (arriba). Reemplazá este div por el código real
     del anuncio (imagen, logo del comercio, script de AdSense, etc.)
     cuando lo tengas -- el tamaño/forma ya está pensado para no romper
     el resto del diseño. -->
<div class="ad-slot ad-top" id="adTop">
  <span class="ad-label">Espacio publicitario</span>
</div>

<div class="wrap">
  <div class="grid" id="grid"></div>

  <div class="share-row">
    <a class="share" id="shareLink" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5C10 9 9.4 7.6 9.2 7c-.2-.5-.4-.5-.6-.5h-.5c-.2 0-.5.1-.7.3-.2.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.4 2 12c0 1.9.5 3.6 1.4 5.2L2 22l4.9-1.3C8.5 21.6 10.2 22 12 22c5.5 0 10-4.4 10-10S17.5 2 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3C4.4 15 4 13.5 4 12 4 7.5 7.6 4 12 4s8 3.5 8 8-3.6 8.2-8 8.2z"/></svg>
      Compartir por WhatsApp
    </a>
  </div>
</div>

<!-- ESPACIO PUBLICITARIO (abajo). Mismo criterio que el de arriba. -->
<div class="ad-slot ad-bottom" id="adBottom">
  <span class="ad-label">Espacio publicitario</span>
</div>

</div><!-- /.page-pad -->

<script>
  // URL del Web App de Apps Script (GET) -- devuelve el estado actual de
  // los overrides manuales (manual_overrides) en vivo, sin caché.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyi2aKtpl3bVKSS2eQVynH8SPjNbCkGxFBtRzhLzUyDfCz7MPeMwm_hJ_wwcXfZ-UM/exec";
  const PAGE_URL = "https://sanjuandolar.com";

  // Compra y venta se muestran como números enteros, sin decimales ni coma.
  const fmt = new Intl.NumberFormat("es-AR", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const dtf = new Intl.DateTimeFormat("es-AR", {
    timeZone: "America/Argentina/Buenos_Aires",
    day: "2-digit", month: "2-digit", year: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });

  function fechaHs(iso) {
    if (!iso) return "sin datos";
    const parts = dtf.formatToParts(new Date(iso)).reduce((a, p) => (a[p.type] = p.value, a), {});
    return `${parts.day}/${parts.month}/${parts.year} - ${parts.hour}:${parts.minute} hs.`;
  }

  function relTime(iso) {
    if (!iso) return "sin datos";
    const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (min < 1) return "hace instantes";
    if (min < 60) return `hace ${min} min`;
    const hr = Math.round(min / 60);
    return hr < 24 ? `hace ${hr} h` : `hace ${Math.round(hr / 24)} d`;
  }

  function cardHTML(cfg) {
    const active = cfg.manual || cfg.auto;
    if (!active) return "";
    const isManual = !!cfg.manual;
    const badge = isManual
      ? `<span class="badge manual" title="${(cfg.manual.note || "Actualizado manualmente").replace(/"/g, "&quot;")}">manual</span>`
      : `<span class="badge auto">auto</span>`;
    return `
      <div class="card" style="--accent:${cfg.color}">
        <div class="card-badge">${badge}</div>
        <div class="card-title">
          <span class="flag">${cfg.flag}</span>
          <h2>${cfg.label}</h2>
        </div>
        <div class="figures">
          <div class="figure">
            <span class="k">Compra</span>
            <span class="v">${fmt.format(Math.ceil(active.compra))}</span>
          </div>
          <div class="figure">
            <span class="k">Venta</span>
            <span class="v">${fmt.format(Math.ceil(active.venta))}</span>
          </div>
        </div>
        <div class="updated">Actualizado el ${fechaHs(active.updated_at)}</div>
      </div>`;
  }

  function render(data) {
    const m = data.manual || {};
    // El dólar oficial se sigue guardando en DATA (por si se vuelve a
    // mostrar más adelante) pero no se muestra en la pizarra.
    const cards = [
      { key: "usd_blue", label: "Dólar", flag: "🇺🇸", color: "#2dd4bf", auto: data.usd_blue, manual: m.usd_blue },
      { key: "eur_oficial", label: "Euro", flag: "🇪🇺", color: "#a3e635", auto: data.eur_oficial, manual: m.eur_oficial },
    ];
    document.getElementById("grid").innerHTML = cards.map(cardHTML).join("");

    const activeBlue = m.usd_blue || data.usd_blue;
    const activeEur = m.eur_oficial || data.eur_oficial;
    if (activeBlue && activeEur) {
      const shareText =
        `Cotización de hoy 💱\n` +
        `Dólar blue: $${fmt.format(activeBlue.venta)}\n` +
        `Euro: $${fmt.format(activeEur.venta)}\n\n` +
        `Mirala actualizada acá: ${PAGE_URL}`;
      document.getElementById("shareLink").href =
        "https://wa.me/?text=" + encodeURIComponent(shareText);
    }
  }

  // 1) Primer pintado instantáneo con los datos que vinieron "horneados"
  //    en el HTML (generados por Apps Script en la última sincronización).
  let currentData = {"usd_oficial":{"compra":1485,"venta":1535,"updated_at":"2026-09-23T14:00:00.000Z"},"usd_blue":{"compra":1540,"venta":1560,"updated_at":"2026-09-23T16:59:00.000Z"},"eur_oficial":{"compra":1714,"venta":1884,"updated_at":"2026-09-23T17:44:14.667Z"},"manual":{"usd_oficial":null,"usd_blue":{"compra":1490,"venta":1570,"updated_at":"2026-09-23T17:44:14.667Z","note":"Actualizado manualmente vía Telegram","auto_baseline":{"compra":1540,"venta":1560}},"eur_oficial":null},"last_sync":"2026-09-23T17:48:13.690Z"};
  render(currentData);

  // 2) Apenas carga la página, pedimos los valores en vivo directamente
  //    (DolarAPI para blue/euro automáticos, el Web App de Apps Script
  //    para saber si hay algún override manual cargado) y volvemos a
  //    pintar con eso -- así no hay que esperar a que GitHub Pages
  //    actualice el HTML publicado.
  async function fetchJSON(url) {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function refreshLive() {
    const [blue, eur, state] = await Promise.allSettled([
      fetchJSON("https://dolarapi.com/v1/dolares/blue"),
      fetchJSON("https://dolarapi.com/v1/cotizaciones/eur"),
      fetchJSON(APPS_SCRIPT_URL),
    ]);

    const next = Object.assign({}, currentData);
    if (blue.status === "fulfilled") {
      next.usd_blue = {
        compra: blue.value.compra,
        venta: blue.value.venta,
        updated_at: blue.value.fechaActualizacion,
      };
    }
    if (eur.status === "fulfilled") {
      next.eur_oficial = {
        compra: eur.value.compra,
        venta: eur.value.venta,
        updated_at: eur.value.fechaActualizacion,
      };
    }
    if (state.status === "fulfilled" && state.value && state.value.manual) {
      next.manual = state.value.manual;
    }
    next.last_sync = new Date().toISOString();

    currentData = next;
    render(currentData);
  }

  refreshLive();
  // 3) Si alguien deja la pestaña abierta, la refrescamos sola cada minuto.
  setInterval(refreshLive, 60000);
</script>
</body>
</html>
